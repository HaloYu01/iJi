# Gradle JVM 参数
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AndroidX
android.useAndroidX=true
# Kotlin 代码风格
kotlin.code.style=official
# 非传递性 R 类（编译更快）
android.nonTransitiveRClass=true
# AGP 9.3 起内置 Kotlin 已是默认且 android.builtInKotlin=false 已废弃。
# 保持不应用 org.jetbrains.kotlin.android 插件，完全交给 AGP 内置 Kotlin 编译；
# 若保留该开关但缺少 KGP 插件，Kotlin 产物不会被收集进 dex，导致运行期 ClassNotFound（如 IjiApplication）闪退。
android.newDsl=false
# 允许直接把 debug APK 拷到手机点击安装。
# 默认 AGP 会在清单里写入 android:testOnly="true"，侧载会被系统拒绝（"应用未安装"），
# 只能 adb install -t 或由 Android Studio Run 安装。设为 false 即去掉该标记。
android.injected.testOnly=false
